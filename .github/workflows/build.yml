name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: CoreKit tests
        run: swift test --package-path Packages/CoreKit

  ios-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26 (best effort)
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi

      - name: Xcode version (must be 26 or later)
        run: |
          ls -d /Applications/Xcode*.app || true
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
          echo "Xcode major version: $major"
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is below 26"
            exit 1
          fi
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          set +e
          xcodebuild -project LockIn.xcodeproj -scheme LockIn -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/LockIn.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1
          status=$?
          set -e
          grep -E "error:|warning: .*(deprecated|unavailable)|\*\* (BUILD|ARCHIVE)" build/xcodebuild.log || true
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild exited with status $status"
            exit "$status"
          fi
          test -d build/LockIn.xcarchive/Products/Applications/LockIn.app

      - name: Compiler facts for DESIGN.md §11
        if: always()
        run: |
          echo "default isolation:"; grep -o -m3 -E -- "-default-isolation[= ]?[A-Za-z]*|SWIFT_DEFAULT_ACTOR_ISOLATION[^ ]*" build/xcodebuild.log || echo "not found"
          echo "swift version:"; xcrun swift --version

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/LockIn.xcarchive/Products/Applications/LockIn.app Payload/
          zip -qry LockIn.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LockIn.ipa
          path: LockIn.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
